app = "sal-parts-team"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_MODE = "replay"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
